# Conventional commits on main → release-please keeps a release PR open with
# the next version and its changelog. Merging that PR tags vX.Y.Z, publishes
# the GitHub release and attaches the installable tarball.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  tarball:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          npm pack
          gh release upload "$TAG" dsh-plugin-safe-upgrade-*.tgz --clobber
      - name: Open the release notes with the unofficial-plugin notice
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          notice='> **Unofficial community plugin.** Not made, endorsed or supported by DeepSeek or the DeepSeek Harness (dsh) team. Report problems in this repository, not to the dsh project.'
          body=$(gh release view "$TAG" --json body --jq .body)
          case "$body" in "> **Unofficial"*) exit 0 ;; esac
          printf '%s\n\n%s\n' "$notice" "$body" > notes.md
          gh release edit "$TAG" --notes-file notes.md
